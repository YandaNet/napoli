<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Піцерія{% endblock %}</title>
    <!-- Підключаємо сучасний шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e53e3e;
            --primary-hover: #c53030;
            --primary-light: #fff5f5;
            --accent: #dd6b20;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --radius: 14px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.1);
            --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.07), 0 4px 6px -2px rgba(0,0,0,0.04);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Стильна навігація з ефектом скла (Glassmorphism) */
        nav {
            background: rgba(26, 32, 44, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 40px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav a {
            color: #cbd5e0;
            text-decoration: none;
            margin-right: 28px;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: #ffffff;
            transform: translateY(-1px);
        }

        .nav-right {
            margin-left: auto;
            color: #cbd5e0;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 15px;
        }

        .nav-right form {
            margin: 0;
        }

        .nav-right button {
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.3);
        }

        .nav-right button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(229, 62, 62, 0.4);
        }

        /* Основний контейнер */
        main {
            max-width: 900px;
            width: 100%;
            margin: 40px auto;
            padding: 0 24px;
            flex: 1;
        }

        /* Сучасні картки */
        .card {
            background: var(--card-bg);
            padding: 24px 30px;
            margin-bottom: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: #cbd5e0;
        }

        /* Заголовки */
        h1, h2, h3 {
            color: #1a202c;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 24px;
        }

        /* Ціна */
        .price {
            color: var(--primary);
            font-weight: 800;
            font-size: 1.25rem;
        }

        /* Автоматичне стилізування будь-яких кнопок та полів на всіх сторінках (логін, реєстрація, форми страв) */
        button:not(nav button), input[type="submit"], .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #c53030 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(229, 62, 62, 0.25);
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }

        button:not(nav button):hover, input[type="submit"]:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 62, 62, 0.35);
        }

        /* Поля вводу форм (input, textarea, select) */
        input[type="text"], input[type="password"], input[type="email"], input[type="number"], textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            background: #ffffff;
            color: var(--text-main);
            transition: all 0.2s ease;
            margin-top: 6px;
            margin-bottom: 16px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(229, 62, 62, 0.1);
        }

        /* Повідомлення (alerts) */
        .alert {
            background: var(--primary-light);
            border: 1.5px solid #feb2b2;
            color: #9b2c2c;
            padding: 16px 20px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            font-weight: 500;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Підвал */
        footer {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            background: white;
        }
    </style>
</head>
<body>

<nav>
    <a href="{% url 'menu:home' %}">Головна</a>
    <a href="{% url 'menu:menu_list' %}">Меню</a>
    <a href="{% url 'menu:cart_detail' %}">🛒 Кошик</a>


    <div class="nav-right">
        {% if user.is_authenticated %}
            <span>Вітаю, <strong>{{ user.username }}</strong></span>
            <form action="{% url 'accounts:logout' %}" method="post" style="display: inline; margin-left: 10px;">
    {% csrf_token %}
    <button type="submit" style="background: none; border: none; color: blue; cursor: pointer; text-decoration: underline;">Вийти</button>
</form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Увійти</a>
            <a href="{% url 'accounts:register' %}">Реєстрація</a>
        {% endif %}
    </div>
</nav>

<main>
    {% if messages %}
        {% for message in messages %}
            <div class="alert">
                <span>🔔</span>
                <div>{{ message }}</div>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

<footer>
    <p>&copy; 2026 Піцерія. Усі права захищені.</p>
</footer>

</body>
</html>
